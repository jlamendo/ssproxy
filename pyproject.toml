[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssproxy"
version = "0.2.0"
description = "Egress credential scrubber for LLM API traffic, shipped as a mitmproxy addon library."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "mitmproxy",
  "credentials",
  "secrets",
  "scrubber",
  "llm",
  "anthropic",
  "openai",
  "egress-filter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security",
]
dependencies = [
  "mitmproxy >= 11.0",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8",
]

[project.urls]
Homepage = "https://github.com/jlamendo/ssproxy"
Issues = "https://github.com/jlamendo/ssproxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssproxy = ["*.py"]
